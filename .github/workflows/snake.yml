name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVG animado
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dragoniana
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#BE95FF&color_dots=#1F1830,#5C427E,#8A5BBE,#B58AE5,#DFC3FF

      - name: Publicar SVG no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
