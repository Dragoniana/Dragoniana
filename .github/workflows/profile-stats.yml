name: Atualizar estatísticas do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/profile_stats.py'

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar os cartões SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Dragoniana
        run: python scripts/profile_stats.py
      - name: Salvar cartões no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          if git diff --cached --quiet; then
            echo 'Estatísticas sem alterações.'
          else
            git commit -m "Atualiza cartões de estatísticas [skip ci]"
            git push origin HEAD:main
          fi
